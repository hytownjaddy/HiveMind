name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run verify

  python:
    name: Lab worker verify (ruff, pyright, contract drift, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/lab-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run task verify

  lab-worker-docker:
    name: Lab worker providers on Docker (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/lab-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Build the linux-lab image (digest-pinned base)
        run: docker build -q -t hivemind/linux-lab:1.0.0 images/linux-lab
      - name: container.linux integration tests, 20 up/down cycles (acceptance 2, 3, 5, 6)
        run: HIVEMIND_TEST_CYCLES=20 uv run pytest -q -m docker
      - name: Nothing left on the runner
        if: always()
        run: |
          docker ps -a --filter label=hivemind.session --format '{{.Names}}' | tee /tmp/leftovers
          test ! -s /tmp/leftovers
          docker network ls --filter label=hivemind.session --format '{{.Name}}' | tee /tmp/leftover-nets
          test ! -s /tmp/leftover-nets

  restore-drill:
    name: Restore drill (export → fresh D1 → content readable)
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Seed a source database (migrations + offline publish of content/)
        run: |
          bun run hivemind -- content publish content/ --sql-out .hivemind/build/publish.sql
          apps/web/node_modules/.bin/wrangler d1 migrations apply DB --local -c apps/web/wrangler.jsonc
          apps/web/node_modules/.bin/wrangler d1 execute DB --local -c apps/web/wrangler.jsonc --file .hivemind/build/publish.sql
      - name: Export (stands in for the nightly R2 export)
        run: apps/web/node_modules/.bin/wrangler d1 export DB --local -c apps/web/wrangler.jsonc --output .hivemind/build/export.sql
      - name: Restore into a fresh database and check
        run: tools/backup/restore-drill.sh .hivemind/build/export.sql
      - name: Read the restored content through the service layer
        run: HIVEMIND_RESTORE_EXPORT=$PWD/.hivemind/build/export.sql bun --cwd packages/core test -- test/restore-drill.test.ts
