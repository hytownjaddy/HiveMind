id: bgp.dual_spine
version: 1.0.0
title: Two spines, N leaves, eBGP everywhere
description: >-
  Every leaf peers with both spines over point-to-point /31 links; every router
  announces its loopback. Leaf count and ASN scheme vary by seed.
status: active
aliases: []
requires: [network.containerlab, routing.frr, privilege.net_admin]
generator: bgp.dual_spine
parameters:
  - { name: leaf_count, kind: int_range, values: [2, 4] }
  - { name: asn_scheme, kind: choice, values: [private, public] }
images:
  # FRRouting 10.7.1, multi-arch manifest list on quay.io, pinned by digest (invariant 5).
  router: quay.io/frrouting/frr:10.7.1@sha256:e995beaa50fdc9edb35eadcfefa29b7f062cc06f2b812613789b68fa541554d2
resources: { cpu_millicores: 2000, memory_mb: 2048, disk_mb: 4096 }
network: { egress: deny, allowlist: [] }
ttl_minutes: 120
snapshot: false
