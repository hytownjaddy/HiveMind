id: linux.pair
version: 1.0.0
title: Two Linux hosts on a point-to-point link
description: >-
  host1 and host2 share a seeded /30 over eth1, so addressing, ARP, static
  routes, and reachability exercises have a real neighbour to talk to.
status: active
aliases: []
requires: [shell.linux, network.veth, network.containerlab]
generator: linux.pair
parameters:
  - { name: subnet_second_octet, kind: int_range, values: [1, 250] }
images:
  host: hivemind/linux-lab:1.0.0
resources: { cpu_millicores: 1000, memory_mb: 1024, disk_mb: 2048 }
network: { egress: deny, allowlist: [] }
ttl_minutes: 90
snapshot: false
