- id: lpm
  statement: >-
    When several routes match a destination, the kernel forwards according to the
    route with the longest (most specific) prefix; only among routes of equal prefix
    length does the metric decide.
  source_ids: [src.rfc1812, src.iproute2.ip-route]
  verification: unverified
- id: connected
  statement: >-
    Assigning an address with a prefix length to an interface makes the kernel add a
    connected (scope link, proto kernel) route for that prefix automatically.
  source_ids: [src.iproute2.ip-address, src.iproute2.ip-route]
  verification: unverified
- id: default-prefix
  statement: >-
    The keyword default in ip route is shorthand for the prefix 0.0.0.0/0, the least
    specific route possible.
  source_ids: [src.iproute2.ip-route]
  verification: unverified
- id: get
  statement: >-
    ip route get performs the same lookup the kernel would perform for a packet to that
    destination and prints the selected route, including the output interface and the
    source address that would be used.
  source_ids: [src.iproute2.ip-route]
  verification: unverified
- id: gateway-onlink
  statement: >-
    A gateway given with via must itself be reachable through a directly connected
    route on the chosen interface; otherwise the kernel rejects the route with
    "Nexthop has invalid gateway".
  source_ids: [src.iproute2.ip-route, src.rfc1812]
  verification: unverified
- id: route-types
  statement: >-
    Besides unicast routes, ip route can install blackhole, unreachable, and prohibit
    routes that discard matching packets, silently or with an ICMP error.
  source_ids: [src.iproute2.ip-route]
  verification: unverified
- id: metric
  statement: >-
    The metric (also shown as priority) orders routes of the same prefix; lower values
    are preferred.
  source_ids: [src.iproute2.ip-route]
  verification: unverified
- id: not-persistent
  statement: >-
    Routes added with ip route live only in the running kernel; they disappear at
    reboot unless a network configuration system re-creates them.
  source_ids: [src.rhcsa.networking-objectives, src.iproute2.ip-route]
  verification: unverified
- id: rp-filter
  statement: >-
    With reverse-path filtering enabled (rp_filter set to strict mode), the kernel drops
    incoming packets whose source address would not be routed back out through the
    interface they arrived on.
  source_ids: [src.kernel.ip-sysctl]
  verification: unverified
- id: forwarding
  statement: >-
    A host only forwards packets addressed to other hosts when IP forwarding is enabled
    (ip_forward); the routing table alone does not turn a host into a router.
  source_ids: [src.kernel.ip-sysctl, src.rfc1812]
  verification: unverified
